# SwiftSalon Muslimah - Docker Compose Configuration
# Complete Self-Contained Setup for Proxmox LXC Deployment

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: swiftsalon-postgres
    environment:
      - POSTGRES_DB=swiftsalon
      - POSTGRES_USER=swiftsalon_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-swiftsalon_secure_password}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
      - ./database/backups:/backups
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - swiftsalon-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swiftsalon_user -d swiftsalon"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SwiftSalon Application
  swiftsalon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swiftsalon-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://swiftsalon_user:${POSTGRES_PASSWORD:-swiftsalon_secure_password}@postgres:5432/swiftsalon?schema=public
      - DIRECT_URL=postgresql://swiftsalon_user:${POSTGRES_PASSWORD:-swiftsalon_secure_password}@postgres:5432/swiftsalon?schema=public
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - BUSINESS_NAME=${BUSINESS_NAME}
      - WHATSAPP_NUMBER=${WHATSAPP_NUMBER}
      - POINTS_PER_RINGGIT=${POINTS_PER_RINGGIT}
      # Optional Supabase for advanced features
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
    volumes:
      - ./public:/app/public
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - swiftsalon-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Redis for session management and caching
  redis:
    image: redis:7-alpine
    container_name: swiftsalon-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - swiftsalon-network
    command: redis-server --appendonly yes

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: swiftsalon-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - swiftsalon
    restart: unless-stopped
    networks:
      - swiftsalon-network

  # Optional: Monitoring with Portainer
  portainer:
    image: portainer/portainer-ce:latest
    container_name: swiftsalon-portainer
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped
    networks:
      - swiftsalon-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  portainer_data:
    driver: local

networks:
  swiftsalon-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16