  services:
    app:
      image: node:18-alpine
      working_dir: /app
      volumes:
        - .:/app
      ports:
        - "3000:3000"
      command: npm start
      depends_on:
        - postgres

    postgres:
      image: postgres:15-alpine
      environment:
        POSTGRES_DB: ${POSTGRES_DB:-swiftsalon_db}
        POSTGRES_USER: ${POSTGRES_USER:-swiftsalon_user}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data

  volumes:
    postgres_data:
